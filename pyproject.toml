[project]
name = "cross-paradigm-solver-benchmark"
version = "0.1.0"
description = "Cross-paradigm benchmark of game solvers (Sudoku, Connect Four, Wordle)"
requires-python = ">=3.13"
dependencies = [
    "ortools",
    "pandas",
    "z3-solver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.0",
]
notebook = [
    "ipykernel",
    "jupyterlab",
    "jupyter-client>=8.9.1",
    "matplotlib",
    "nbconvert>=7.17.1",
    "numpy",
    "seaborn",
]

[tool.uv]
default-groups = ["dev", "notebook"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["notebook.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
